[package]
authors = ["The Chromium OS Authors"]
edition.workspace = true
name = "net_util"
rust-version.workspace = true
version = "0.1.0"

[features]
# In-process AF_XDP (XSK) network backend. Off by default so the dependency on
# `aya` (and the AF_XDP datapath code) is only pulled in when explicitly enabled.
# Enabling it also pulls in `aya-build`, which compiles the embedded XDP redirect
# program in `build.rs` (requires nightly + `bpf-linker`).
net_backend_af_xdp = ["dep:aya", "dep:aya-build"]

[dependencies]
# AF_XDP (XSK) datapath. Pure Rust, no C system dependencies. Pinned to the fork
# branch that adds the `xsk` module until that work lands upstream in
# `aya-rs/aya` and is published to crates.io.
aya = { git = "https://github.com/mccormickt/aya", optional = true, rev = "27ffd32b89be2684906256187801fe46a75d1f40" }
epoll = { workspace = true }
getrandom = "0.4.2"
libc = { workspace = true }
log = { workspace = true }
rate_limiter = { path = "../rate_limiter" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
virtio-bindings = { workspace = true }
virtio-queue = { workspace = true }
vm-memory = { workspace = true, features = [
  "backend-atomic",
  "backend-bitmap",
  "backend-mmap",
] }
vm-virtio = { path = "../vm-virtio" }
vmm-sys-util = { workspace = true }

[build-dependencies]
# Compiles the standalone `xdp-ebpf` crate to an embeddable object in `build.rs`.
# Optional and only enabled by `net_backend_af_xdp`, so default builds need
# neither nightly nor `bpf-linker`. Pinned to the same fork revision as `aya`.
aya-build = { git = "https://github.com/mccormickt/aya", optional = true, rev = "27ffd32b89be2684906256187801fe46a75d1f40" }

[dev-dependencies]
pnet = "0.35.0"
pnet_datalink = "0.35.0"
serde_json = { workspace = true }

[lints]
workspace = true
